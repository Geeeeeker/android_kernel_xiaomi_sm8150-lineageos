name: 编译内核 (raphael)

on:
  push:
    branches:
      - dev/*
      - stable/*
  workflow_dispatch:

env:
  AOSP_TOOLCHAIN_BRANCH: android15        # 分支名不包含 "-release"
  AOSP_CLANG_VERSION: r498229b

jobs:
  build:
    name: 编译内核
    permissions: { contents: write }
    runs-on: ubuntu-latest
    strategy:
      matrix:
        device: [raphael]

    steps:
      - name: 安装软件包
        env:
          # 合并两个工作流所需的包
          PACKAGES: >-
            ccache binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi
            device-tree-compiler gcc-aarch64-linux-gnu make dos2unix
        run: |
          sudo apt update > /dev/null
          sudo apt install -y ${{ env.PACKAGES }} > /dev/null

      - name: 同步仓库
        uses: actions/checkout@v4
        with:
          path: kernel

      # ---------- 来自 tree.yml 的深度清理 ----------
      - name: 深度清理所有相关设备树源文件
        working-directory: kernel
        run: |
          find arch/arm64/boot/dts -type f \( -name "*.dts" -o -name "*.dtsi" \) -print0 | while IFS= read -r -d '' FILE; do
            echo "正在清理: $FILE"
            # 移除 UTF-8 BOM 头
            sed -i '1s/^\xEF\xBB\xBF//' "$FILE"
            # 转换为 Unix 换行符
            dos2unix "$FILE"
            # 过滤非打印字符（保留换行、制表符和可打印 ASCII）
            tr -cd '\11\12\15\40-\176' < "$FILE" > "${FILE}.clean"
            mv "${FILE}.clean" "$FILE"
            # 确保文件以换行结尾
            echo >> "$FILE"
          done

      # ---------- 原有 Clang 缓存与下载 ----------
      - name: 缓存Clang
        id: cache-clang
        uses: actions/cache@v4
        with:
          path: clang
          key: clang-${{ env.AOSP_TOOLCHAIN_BRANCH }}-${{ env.AOSP_CLANG_VERSION }}

      - name: 下载Clang
        if: steps.cache-clang.outputs.cache-hit != 'true'
        run: |
          mkdir -p clang &&
          curl -LSs "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/${{ env.AOSP_TOOLCHAIN_BRANCH }}-release/clang-${{ env.AOSP_CLANG_VERSION }}.tar.gz" |
          tar xz -C clang

      - name: 缓存ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: kernel-${{ matrix.device }}
          restore-keys: kernel-${{ matrix.device }}
          max-size: 5G

      # ---------- 内核配置修改 ----------
      - name: 配置内核基础参数 (Kprobes/OverlayFS/LTO等)
        working-directory: kernel
        run: |
          DEFCONFIG="arch/arm64/configs/raphael_defconfig"
          
          # 开启 Kprobes
          echo "CONFIG_MODULES=y" >> $DEFCONFIG
          echo "CONFIG_KPROBES=y" >> $DEFCONFIG
          echo "CONFIG_HAVE_KPROBES=y" >> $DEFCONFIG
          echo "CONFIG_KPROBE_EVENTS=y" >> $DEFCONFIG
          
          # 开启 OverlayFS
          echo "CONFIG_OVERLAY_FS=y" >> $DEFCONFIG
          
          # 禁用 LTO
          sed -i 's/CONFIG_LTO=y/CONFIG_LTO=n/' $DEFCONFIG
          sed -i 's/CONFIG_LTO_CLANG=y/CONFIG_LTO_CLANG=n/' $DEFCONFIG
          sed -i 's/CONFIG_THINLTO=y/CONFIG_THINLTO=n/' $DEFCONFIG
          echo "CONFIG_LTO_NONE=y" >> $DEFCONFIG
          
          # 禁用 CC_WERROR
          echo "CONFIG_CC_WERROR=n" >> $DEFCONFIG

      - name: 配置 LXC 和 Docker 支持
        working-directory: kernel
        run: |
          DEFCONFIG="arch/arm64/configs/raphael_defconfig"
          rm -rf utils
          git clone https://github.com/tomxi1997/lxc-docker-support-for-android.git utils

          # 移除 LXC 补丁中强制选中的越权语句
          sed -i '/select CFS_BANDWIDTH/d' utils/Kconfig
          sed -i '/select DOCKER_STATISTICS/d' utils/Kconfig
          sed -i '/select BLK_DEV_THROTTLING/d' utils/Kconfig
          sed -i '/select CFQ_GROUP_IOSCHED/d' utils/Kconfig
          sed -i '/select BRIDGE_VLAN_FILTERING/d' utils/Kconfig
          
          echo 'source "utils/Kconfig"' >> "Kconfig"
          echo "CONFIG_DOCKER=y" >> $DEFCONFIG
          
          # 在 defconfig 显式禁用会引发代码冲突的调度器特性
          echo "# CONFIG_CFS_BANDWIDTH is not set" >> $DEFCONFIG
          echo "# CONFIG_DOCKER_STATISTICS is not set" >> $DEFCONFIG

          # 禁用偏执网络
          sed -i '/CONFIG_ANDROID_PARANOID_NETWORK/d' $DEFCONFIG
          echo "# CONFIG_ANDROID_PARANOID_NETWORK is not set" >> $DEFCONFIG
          
          # 显式禁用发生冲突的 Block 特性
          echo "# CONFIG_BLK_DEV_THROTTLING is not set" >> $DEFCONFIG
          echo "# CONFIG_CFQ_GROUP_IOSCHED is not set" >> $DEFCONFIG

          # 修复内核源码自带的 QVR 设备树语法错误 (sdm845)
          sed -i '/sdm845-v2-qvr-evt.dtb/d' arch/arm64/boot/dts/qcom/Makefile
          sed -i '/qvr/d' arch/arm64/boot/dts/qcom/Makefile
          sed -i '/interposer/d' arch/arm64/boot/dts/qcom/Makefile

          # 统一在此处应用 runc 补丁和 qtaguid 补丁
          chmod +x utils/runcpatch.sh
          if [ -f kernel/cgroup/cgroup.c ]; then
              sh utils/runcpatch.sh kernel/cgroup/cgroup.c
          fi
          if [ -f kernel/cgroup.c ]; then
              sh utils/runcpatch.sh kernel/cgroup.c
          fi
          if [ -f net/netfilter/xt_qtaguid.c ]; then
              patch -p0 < utils/xt_qtaguid.patch
          fi

      # ---------- 修复触摸屏驱动 ----------
      - name: 修复触摸屏驱动中的函数原型 (添加 void)
        working-directory: kernel
        run: |
          FILE="drivers/input/touchscreen/xiaomi/xiaomi_touch.c"
          if [ -f "$FILE" ]; then
            echo "正在修复 $FILE 中的函数原型..."
            sed -i 's/^struct class \*get_xiaomi_touch_class()/struct class *get_xiaomi_touch_class(void)/' "$FILE"
            sed -i 's/^struct device \*get_xiaomi_touch_dev()/struct device *get_xiaomi_touch_dev(void)/' "$FILE"
            echo "修复完成。"
          else
            echo "警告：$FILE 不存在，跳过"
          fi

      # ---------- 清理旧的构建输出 ----------
      - name: 清理之前的构建输出
        working-directory: kernel
        run: rm -rf out

      # ---------- 编译内核（包含所有设备树）----------
      - name: 编译
        working-directory: kernel
        run: |
          export PATH=$GITHUB_WORKSPACE/clang/bin:$PATH
          export KBUILD_BUILD_USER=${{ github.repository_owner }}
          export KBUILD_BUILD_HOST=github-runner
          export KBUILD_BUILD_TIMESTAMP=$(date -u -d "@$(git log -1 --format=%at)" +"%a %b %d %H:%M:%S %Z %Y")
          make -j$(nproc --all) \
            CC="ccache clang" \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            O=out \
            KCFLAGS="-Wno-error=strict-prototypes" \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            raphael_defconfig all

      # ---------- 收集 raphael 设备树文件（来自 tree.yml）----------
      - name: 收集 raphael 设备树文件
        working-directory: kernel
        run: |
          mkdir -p ../dtb_artifacts
          find out/arch/arm64/boot/dts -type f \( \
            -name "raphael*.dtb" -o \
            -name "raphael*.dtbo" -o \
            -name "sm8150-xiaomi.dtb" \
          \) -exec cp {} ../dtb_artifacts/ \;
          
          if [ -z "$(ls -A ../dtb_artifacts)" ]; then
            echo "❌ 错误：未找到任何 raphael 设备树文件"
            exit 1
          else
            echo "✅ 找到以下设备树文件："
            ls -la ../dtb_artifacts/
          fi

      # ---------- 打包 AnyKernel3 ----------
      - name: 打包(AnyKernel3)
        run: |
          git clone https://github.com/osm0sis/AnyKernel3 --depth=1 ak3
          cp kernel/out/arch/arm64/boot/Image.gz-dtb ak3/
          cd ak3
          cat >anykernel.sh <<EOF
          properties() { '
          kernel.string=Kernel for ${{ matrix.device }}
          device.name1=${{ matrix.device }}
          do.devicecheck=1
          '; }
          ramdisk_compression=auto
          patch_vbmeta_flag=auto
          is_slot_device=auto
          block=auto
          . tools/ak3-core.sh
          split_boot
          flash_boot
          EOF
          zip -qr9 Anykernel3-${{ matrix.device }}.zip * -x .git .github README.md *placeholder

      # ---------- 打包 boot 镜像 ----------
      - name: 打包(boot)
        run: |
          git clone https://android.googlesource.com/platform/system/tools/mkbootimg --depth=1 mkbootimg
          cp kernel/out/arch/arm64/boot/Image.gz-dtb mkbootimg/
          cd mkbootimg
          boot_url=$(curl -LSs https://download.lineageos.org/api/v2/devices/${{ matrix.device }}/builds | jq -r '.[0].files[1].url')
          curl -LSs $boot_url -o boot.img
          mkbootimg_args=$(./unpack_bootimg.py --out out --boot_img boot.img --format mkbootimg)
          mv Image.gz-dtb out/kernel
          eval "./mkbootimg.py $mkbootimg_args -o boot-lineage-${{ matrix.device }}.img"

      # ---------- 上传三个产物 ----------
      - name: 上传 AnyKernel3 包
        uses: actions/upload-artifact@v5
        with:
          name: kernel-${{ matrix.device }}-ak3
          path: ak3/Anykernel3-${{ matrix.device }}.zip

      - name: 上传 boot 镜像
        uses: actions/upload-artifact@v5
        with:
          name: kernel-${{ matrix.device }}-boot
          path: mkbootimg/boot-lineage-${{ matrix.device }}.img

      - name: 上传 raphael 设备树文件
        uses: actions/upload-artifact@v5
        with:
          name: kernel-${{ matrix.device }}-dtb
          path: dtb_artifacts/

  # ---------- 发布作业（原 15.yml 中的 release）----------
  release:
    name: 发布
    permissions: { contents: write }
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: 获取构建产物
        uses: actions/download-artifact@v6
        with:
          path: kernel
          pattern: kernel-*
          merge-multiple: true

      - name: 获取当前时间
        id: time
        run: |
          echo "time=$(TZ='Asia/Shanghai' date -u +'%Y%m%d%H%M')" >> $GITHUB_OUTPUT
          echo "timestamp=$(date +%s)" >> $GITHUB_OUTPUT

      - name: 下载ci管理器
        continue-on-error: true
        uses: dawidd6/action-download-artifact@v11
        with:
          repo: rsuntk/KernelSU
          workflow_conclusion: success
          name: manager
          workflow: build-manager.yml
          path: manager

      - name: 发布
        uses: softprops/action-gh-release@v2
        with:
          tag_name: rel-${{ steps.time.outputs.timestamp }}
          name: Kernel build ${{ steps.time.outputs.time }}
          prerelease: ${{ startsWith(github.ref_name, 'dev/') }}
          files: |
            kernel/*
            manager/*
