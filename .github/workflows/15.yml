- name: 配置内核
  working-directory: kernel
  run: |
    make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- raphael_defconfig O=out

- name: 编译 raphael 设备树
  working-directory: kernel
  run: |
    # 仅编译 raphael.dtb（根据需要可添加其他目标）
    make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- arch/arm64/boot/dts/qcom/raphael.dtb O=out -j$(nproc)

- name: 收集设备树文件
  run: |
    mkdir -p dtb_artifacts
    find kernel/out/arch/arm64/boot/dts -name "raphael*.dtb" -exec cp {} dtb_artifacts/ \;
    if [ -z "$(ls -A dtb_artifacts)" ]; then
      echo "错误：没有找到 raphael 设备树文件！"
      exit 1
    fi
