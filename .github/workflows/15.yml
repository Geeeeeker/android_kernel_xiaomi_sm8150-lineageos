name: 编译 raphael 设备树

on:
  push:
    branches:
      - dev/*
      - stable/*
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 安装依赖
        run: |
          sudo apt update
          sudo apt install -y \
            device-tree-compiler \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            make \
            dos2unix

      - name: 检出内核源码
        uses: actions/checkout@v4
        with:
          path: kernel

      - name: 修复 raphael-pinctrl.dtsi（移除 BOM 并转换格式）
        working-directory: kernel
        run: |
          FILE="arch/arm64/boot/dts/qcom/xiaomi/overlay/raphael/raphael-pinctrl.dtsi"
          if [ -f "$FILE" ]; then
            echo "=== 修复前文件头（前5行） ==="
            head -5 "$FILE"
            # 移除可能的 UTF-8 BOM 头
            sed -i '1s/^\xEF\xBB\xBF//' "$FILE"
            # 转换为 Unix 换行符
            dos2unix "$FILE"
            echo "=== 修复后文件头（前5行） ==="
            head -5 "$FILE"
          else
            echo "文件 $FILE 不存在，请检查路径"
            exit 1
          fi

      - name: 配置内核（使用 raphael_defconfig）
        working-directory: kernel
        run: |
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- raphael_defconfig O=out

      - name: 编译所有设备树（忽略错误，确保 raphael 被构建）
        working-directory: kernel
        run: |
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- dtbs O=out -k -j$(nproc) || true

      - name: 收集 raphael 设备树文件
        run: |
          mkdir -p dtb_artifacts
          find kernel/out/arch/arm64/boot/dts -type f \( -name "raphael*.dtb" -o -name "raphael*.dtbo" \) -exec cp {} dtb_artifacts/ \;
          if [ -z "$(ls -A dtb_artifacts)" ]; then
            echo "错误：未找到任何 raphael 设备树文件"
            exit 1
          fi

      - name: 上传设备树文件
        uses: actions/upload-artifact@v5
        with:
          name: dtb-raphael
          path: dtb_artifacts/
