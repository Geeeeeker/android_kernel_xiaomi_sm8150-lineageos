name: 编译内核 (仅设备树)

on:
  push:
    branches:
      - dev/*
      - stable/*
  workflow_dispatch:

jobs:
  build:
    name: 编译设备树
    permissions: { contents: write }
    runs-on: ubuntu-latest
    strategy:
      matrix:
        device:
          - raphael
    steps:
      - name: 安装软件包
        run: |
          sudo apt update > /dev/null
          sudo apt install -y \
            device-tree-compiler \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            binutils-arm-linux-gnueabi \
            make > /dev/null

      - name: 同步仓库
        uses: actions/checkout@v4
        with:
          path: kernel

      # 仅保留对设备树 Makefile 的必要修复（删除 QVR 相关错误条目）
      - name: 修复设备树 Makefile (移除 QVR)
        working-directory: kernel
        run: |
          # 删除 sdm845 中的 QVR 设备树编译条目（防止语法错误）
          sed -i '/sdm845-v2-qvr-evt.dtb/d' arch/arm64/boot/dts/qcom/Makefile
          sed -i '/qvr/d' arch/arm64/boot/dts/qcom/Makefile
          sed -i '/interposer/d' arch/arm64/boot/dts/qcom/Makefile

      - name: 配置内核（生成 .config）
        working-directory: kernel
        run: |
          # 使用设备的 defconfig
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- raphael_defconfig O=out

      - name: 编译设备树
        working-directory: kernel
        run: |
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- dtbs O=out -j$(nproc)

      - name: 收集设备树文件
        run: |
          mkdir -p dtb_artifacts
          # 复制所有编译出的 .dtb 和 .dtbo 文件（包括子目录）
          find kernel/out/arch/arm64/boot/dts -type f \( -name "*.dtb" -o -name "*.dtbo" \) -exec cp {} dtb_artifacts/ \;
          # 如果没有找到任何文件，则报错
          if [ -z "$(ls -A dtb_artifacts)" ]; then
            echo "错误：没有找到任何设备树文件！"
            exit 1
          fi

      - name: 上传设备树文件
        uses: actions/upload-artifact@v5
        with:
          name: dtb-${{ matrix.device }}
          path: dtb_artifacts/

  release:
    name: 发布设备树
    permissions: { contents: write }
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: 获取构建产物
        uses: actions/download-artifact@v6
        with:
          path: dtb_files
          pattern: dtb-*
          merge-multiple: true

      - name: 获取当前时间
        id: time
        run: |
          echo "time=$(TZ='Asia/Shanghai' date -u +'%Y%m%d%H%M')" >> $GITHUB_OUTPUT
          echo "timestamp=$(date +%s)" >> $GITHUB_OUTPUT

      - name: 发布
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dtb-${{ steps.time.outputs.timestamp }}
          name: Device Tree build ${{ steps.time.outputs.time }}
          prerelease: ${{ startsWith(github.ref_name, 'dev/') }}
          files: dtb_files/*
