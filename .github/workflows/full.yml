name: 编译内核

on:
  push:
    branches:
      - dev/*
      - stable/*
    tags:
      - 'v*'                     # tag 触发，用于 release
  workflow_dispatch:

env:
  AOSP_TOOLCHAIN_BRANCH: android11-release
  AOSP_CLANG_VERSION: r383902b

jobs:
  build:
    name: 编译内核
    permissions: { contents: write }
    runs-on: ubuntu-latest
    strategy:
      matrix:
        device:
          - raphael
    steps:
      - name: 安装软件包
        env:
          PACKAGES: ccache binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi gcc-arm-linux-gnueabi
        run: |
          sudo apt update > /dev/null
          sudo apt install -y ${{ env.PACKAGES }} > /dev/null

      - name: 同步仓库
        uses: actions/checkout@v4
        with:
          path: kernel

      # 集成 SukiSU-Ultra
      - name: 集成 SukiSU-Ultra
        working-directory: kernel
        run: |
          export GIT_ASKPASS=echo
          git clone --depth=1 https://github.com/SukiSU-Ultra/SukiSU-Ultra.git
          cp -r SukiSU-Ultra/kernel drivers/kernelsu
          echo "obj-\$(CONFIG_KERNELSU) += kernelsu/" >> drivers/Makefile
          echo 'source "drivers/kernelsu/Kconfig"' >> drivers/Kconfig

      - name: 缓存Clang
        id: cache-clang
        uses: actions/cache@v4
        with:
          path: clang
          key: clang-${{ env.AOSP_TOOLCHAIN_BRANCH }}-${{ env.AOSP_CLANG_VERSION }}

      - name: 下载Clang
        if: steps.cache-clang.outputs.cache-hit != 'true'
        run: |
          mkdir -p clang &&
          curl -LSs "https://github.com/Geeeeeker/boot/releases/download/clang-prebuilts-20260319-031015/clang-r383902b.tar.gz" |
          tar xz -C clang

      - name: 缓存ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: kernel-${{ matrix.device }}
          restore-keys: kernel-${{ matrix.device }}
          max-size: 5G

      # 统一配置内核：清理 RTIC + 添加所需选项
      - name: 配置内核
        working-directory: kernel
        run: |
          export PATH=$GITHUB_WORKSPACE/clang/bin:$PATH
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export ARCH=arm64
          export SUBARCH=arm64

          DEFCONFIG="arch/arm64/configs/raphael_defconfig"
          cp $DEFCONFIG $DEFCONFIG.bak

          # 1. 彻底清理 RTIC 相关
          echo "=== 清理 RTIC 配置 ==="
          sed -i '/RTIC/d' $DEFCONFIG
          for cfg in RTIC RTIC_ENGINE RTIC_DRIVER RTIC_FW RTIC_TEST RTIC_SELINUX SECURITY_RTIC; do
            echo "# CONFIG_$cfg is not set" >> $DEFCONFIG
          done
          find . -name "Kconfig" -exec grep -i -E "(config|menuconfig)[[:space:]]+[A-Z0-9_]*rtic" {} \; | \
            sed -n 's/^[[:space:]]*\(config\|menuconfig\)[[:space:]]\+\([A-Z0-9_]*\).*/\2/p' | sort -u | \
            while read cfg; do
              echo "# CONFIG_$cfg is not set" >> $DEFCONFIG
            done

          echo "=== 删除 RTIC 源文件和目录 ==="
          rm -rf security/rtic drivers/rtic 2>/dev/null || true
          find . -type f -name "*rtic*" -exec rm -f {} \; 2>/dev/null || true
          find . -type d -name "rtic" -exec rm -rf {} \; 2>/dev/null || true

          echo "=== 清理 Makefile 和 Kconfig 中的 RTIC 引用 ==="
          find . -name "Makefile" -exec sed -i '/rtic/d' {} \;
          find . -name "Kconfig" -exec sed -i '/rtic/d' {} \;

          echo "=== 修补 security/selinux/hooks.c ==="
          HOOKS="security/selinux/hooks.c"
          if [ -f "$HOOKS" ]; then
            sed -i '/extern.*rtic_state/d' "$HOOKS"
            sed -i '/rtic_state/d' "$HOOKS"
            sed -i '/#include.*rtic/d' "$HOOKS"
          fi

          # 2. 添加所需内核配置选项
          echo "=== 添加额外配置选项 ==="
          cat >> $DEFCONFIG << EOF
          CONFIG_MODULES=y
          CONFIG_KPROBES=y
          CONFIG_HAVE_KPROBES=y
          CONFIG_KPROBE_EVENTS=y
          CONFIG_OVERLAY_FS=y
          CONFIG_LTO_NONE=y
          # CONFIG_LTO is not set
          # CONFIG_LTO_CLANG is not set
          # CONFIG_THINLTO is not set
          CONFIG_CC_WERROR=n
          CONFIG_ASHMEM=y
          CONFIG_SYSVIPC=y
          CONFIG_SYSVIPC_SYSCTL=y
          CONFIG_SYSVIPC_COMPAT=y
          CONFIG_EPOLL=y
          CONFIG_EVENTFD=y
          CONFIG_SIGNALFD=y
          CONFIG_INOTIFY_USER=y
          CONFIG_SHMEM=y
          CONFIG_TMPFS=y
          CONFIG_TMPFS_POSIX_ACL=y
          CONFIG_TMPFS_XATTR=y
          CONFIG_USBIP_CORE=m
          CONFIG_USBIP_VHCI_HCD=m
          CONFIG_USBIP_HOST=m
          CONFIG_BACKLIGHT_CLASS_DEVICE=y
          CONFIG_BACKLIGHT_QCOM=y
          CONFIG_ZRAM=y
          CONFIG_ZRAM_DEF_COMP_ZSTD=y
          CONFIG_CRYPTO_ZSTD=y
          CONFIG_KERNELSU=y
          CONFIG_KPM=y
          CONFIG_KALLSYMS=y
          CONFIG_KALLSYMS_ALL=y
          # CONFIG_MODVERSIONS is not set
          EOF

          # 3. 生成 .config 并进行 olddefconfig 更新
          echo "=== 生成 .config ==="
          make O=out $DEFCONFIG
          scripts/config --file out/.config --disable LTO
          scripts/config --file out/.config --disable LTO_CLANG
          scripts/config --file out/.config --disable THINLTO
          scripts/config --file out/.config --enable LTO_NONE
          scripts/config --file out/.config --disable MODVERSIONS
          make O=out olddefconfig

          echo "=== 验证 RTIC 已禁用 ==="
          grep -i "rtic" out/.config || echo "RTIC 配置已成功禁用"

      - name: 配置 LXC 和 Docker 支持
        working-directory: kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          DEFCONFIG="arch/arm64/configs/raphael_defconfig"
          rm -rf utils
          git clone https://github.com/tomxi1997/lxc-docker-support-for-android.git utils
          sed -i '/select CFS_BANDWIDTH/d' utils/Kconfig
          sed -i '/select DOCKER_STATISTICS/d' utils/Kconfig
          sed -i '/select BLK_DEV_THROTTLING/d' utils/Kconfig
          sed -i '/select CFQ_GROUP_IOSCHED/d' utils/Kconfig
          sed -i '/select BRIDGE_VLAN_FILTERING/d' utils/Kconfig
          echo 'source "utils/Kconfig"' >> "Kconfig"
          scripts/config --file out/.config --enable DOCKER
          echo "CONFIG_DOCKER=y" >> $DEFCONFIG
          echo "# CONFIG_CFS_BANDWIDTH is not set" >> $DEFCONFIG
          echo "# CONFIG_DOCKER_STATISTICS is not set" >> $DEFCONFIG
          sed -i '/CONFIG_ANDROID_PARANOID_NETWORK/d' $DEFCONFIG
          echo "# CONFIG_ANDROID_PARANOID_NETWORK is not set" >> $DEFCONFIG
          echo "# CONFIG_BLK_DEV_THROTTLING is not set" >> $DEFCONFIG
          echo "# CONFIG_CFQ_GROUP_IOSCHED is not set" >> $DEFCONFIG
          sed -i '/sdm845-v2-qvr-evt.dtb/d' arch/arm64/boot/dts/qcom/Makefile
          sed -i '/qvr/d' arch/arm64/boot/dts/qcom/Makefile
          sed -i '/interposer/d' arch/arm64/boot/dts/qcom/Makefile
          chmod +x utils/runcpatch.sh
          if [ -f kernel/cgroup/cgroup.c ]; then
              sh utils/runcpatch.sh kernel/cgroup/cgroup.c
          fi
          if [ -f kernel/cgroup.c ]; then
              sh utils/runcpatch.sh kernel/cgroup.c
          fi
          if [ -f net/netfilter/xt_qtaguid.c ]; then
              patch -p0 < utils/xt_qtaguid.patch
          fi
          make O=out olddefconfig

      - name: 编译
        working-directory: kernel
        run: |
          export PATH=$GITHUB_WORKSPACE/clang/bin:$PATH
          export KBUILD_BUILD_USER=${{ github.repository_owner }}
          export KBUILD_BUILD_HOST=github-runner
          export KBUILD_BUILD_TIMESTAMP=$(date -u -d "@$(git log -1 --format=%at)" +"%a %b %d %H:%M:%S %Z %Y")
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export ARCH=arm64
          export SUBARCH=arm64
          make -j$(nproc --all) \
            CC="ccache clang" \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            O=out \
            KCFLAGS="-Wno-unknown-warning-option" \
            Image.gz-dtb dtbo.img modules

      - name: 收集 USB/IP 内核模块
        run: |
          mkdir -p $GITHUB_WORKSPACE/usbip-out/modules
          cp kernel/out/drivers/usb/usbip/*.ko $GITHUB_WORKSPACE/usbip-out/modules/ || true

      - name: 设置 QEMU 用户态支持
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-static binfmt-support
          docker run --rm --privileged multiarch/qemu-user-static --reset -p yes

      - name: 编译 USB/IP 用户态工具 (Docker 容器)
        run: |
          mkdir -p usbip-out/{bin,libs}
          docker run --rm --platform linux/arm64 \
            --memory=4g \
            -v ${{ github.workspace }}:/workspace \
            -v ${{ github.workspace }}/usbip-out:/output \
            -w /workspace/kernel \
            arm64v8/ubuntu:22.04 \
            bash -c "
              set -e
              export DEBIAN_FRONTEND=noninteractive
              ulimit -s unlimited
              apt update
              apt install -y \
                build-essential \
                autoconf \
                libtool \
                pkg-config \
                libudev-dev \
                libssl-dev \
                flex \
                bison \
                file \
                patchelf
              cd tools/usb/usbip
              ./autogen.sh
              ./configure CFLAGS=\"-O0 -Wno-error\" --prefix=/usr
              make CFLAGS=\"-O0 -Wno-error\" -j1
              cp src/.libs/usbip /output/bin/
              cp src/.libs/usbipd /output/bin/
              cp libsrc/.libs/libusbip.so.0* /output/libs/
              cd /output
              BINARIES=\"bin/usbip bin/usbipd libs/libusbip.so.0*\"
              DEPS=\"\"
              for file in \$BINARIES; do
                if [ -f \"\$file\" ]; then
                  echo \"Collecting dependencies for \$file...\"
                  needed=\$(readelf -d \"\$file\" | grep NEEDED | awk '{print \$5}' | tr -d '[]' || true)
                  for lib in \$needed; do
                    if [[ \"\$DEPS\" != *\"\$lib\"* ]]; then
                      DEPS=\"\$DEPS \$lib\"
                    fi
                  done
                fi
              done
              for lib in \$(echo \$DEPS | tr ' ' '\\n' | sort -u); do
                echo \"Searching for library: \$lib\"
                libpath=\$(find /lib /usr/lib -name \"\$lib\" -type f 2>/dev/null | head -1 || true)
                if [ -n \"\$libpath\" ]; then
                  echo \"Found: \$libpath\"
                  cp -P \"\$libpath\" libs/ 2>/dev/null || cp \"\$libpath\" libs/
                  for reallib in \$(find \"\$(dirname \"\$libpath\")\" -name \"\${lib%.so*}*\" -type f 2>/dev/null); do
                    cp -n \"\$reallib\" libs/ 2>/dev/null || true
                  done
                else
                  echo \"Warning: library \$lib not found\"
                fi
              done
              ld_linux=\"/lib/ld-linux-aarch64.so.1\"
              if [ -f \"\$ld_linux\" ]; then
                cp -P \"\$ld_linux\" libs/
              fi
              echo \"USB/IP user-space tools build and collection complete.\"
            "

      - name: 打包 USB/IP 产物
        run: |
          cd usbip-out
          tar czf ../usbip-arm64-bundle.tar.gz .
          cd ..

      - name: 上传 USB/IP 捆绑包 (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: usbip-arm64-bundle
          path: usbip-arm64-bundle.tar.gz

      - name: Download SukiSU-Ultra Manager APK
        run: |
          LATEST_RELEASE_URL=$(curl -s https://api.github.com/repos/SukiSU-Ultra/SukiSU-Ultra/releases/latest | grep "browser_download_url.*\.apk" | cut -d '"' -f 4)
          if [ -n "$LATEST_RELEASE_URL" ]; then
            wget -O SukiSU-Ultra-Manager.apk "$LATEST_RELEASE_URL"
          else
            echo "Could not fetch SukiSU-Ultra APK, falling back to official KernelSU APK"
            wget -O SukiSU-Ultra-Manager.apk https://github.com/tiann/KernelSU/releases/latest/download/KernelSU.apk
          fi
          mkdir -p apk-output
          cp SukiSU-Ultra-Manager.apk apk-output/

      - name: 打包(AnyKernel3)
        run: |
          git clone https://github.com/osm0sis/AnyKernel3 --depth=1 ak3
          cp kernel/out/arch/arm64/boot/Image.gz-dtb ak3/
          cp kernel/out/arch/arm64/boot/dtbo.img ak3/ || true
          cp apk-output/SukiSU-Ultra-Manager.apk ak3/
          cd ak3
          cat >anykernel.sh <<EOF
          properties() { '
          kernel.string=Kernel for ${{ matrix.device }}
          device.name1=${{ matrix.device }}
          do.devicecheck=1
          '; }
          ramdisk_compression=auto
          patch_vbmeta_flag=auto
          is_slot_device=auto
          block=auto
          . tools/ak3-core.sh
          split_boot
          flash_boot
          EOF
          zip -qr9 Anykernel3-${{ matrix.device }}.zip * -x .git .github README.md *placeholder

      - name: 打包(boot)
        run: |
          git clone https://android.googlesource.com/platform/system/tools/mkbootimg --depth=1 mkbootimg
          cp kernel/out/arch/arm64/boot/Image.gz-dtb mkbootimg/
          cd mkbootimg
          boot_url=$(curl -LSs https://download.lineageos.org/api/v2/devices/${{ matrix.device }}/builds | jq -r '.[0].files[1].url')
          curl -LSs $boot_url -o boot.img
          mkbootimg_args=$(./unpack_bootimg.py --out out --boot_img boot.img --format mkbootimg)
          mv Image.gz-dtb out/kernel
          eval "./mkbootimg.py $mkbootimg_args -o boot-lineage-${{ matrix.device }}.img"

      - name: 上传 AnyKernel3 安装包
        uses: actions/upload-artifact@v5
        with:
          name: kernel-${{ matrix.device }}-ak3
          path: ak3/Anykernel3-${{ matrix.device }}.zip

      - name: 上传 boot 镜像
        uses: actions/upload-artifact@v5
        with:
          name: kernel-${{ matrix.device }}-boot
          path: mkbootimg/boot-lineage-${{ matrix.device }}.img

      - name: 上传 APK 工件
        uses: actions/upload-artifact@v5
        with:
          name: SukiSU-Ultra-Manager
          path: apk-output/SukiSU-Ultra-Manager.apk

  release:
    name: 发布
    permissions: { contents: write }
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: 获取构建产物
        uses: actions/download-artifact@v6
        with:
          path: kernel
          pattern: kernel-*
          merge-multiple: true

      - name: 获取 USB/IP 捆绑包
        uses: actions/download-artifact@v6
        with:
          name: usbip-arm64-bundle
          path: usbip

      - name: 获取 APK
        uses: actions/download-artifact@v6
        with:
          name: SukiSU-Ultra-Manager
          path: manager

      - name: 获取当前时间
        id: time
        run: |
          echo "time=$(TZ='Asia/Shanghai' date -u +'%Y%m%d%H%M')" >> $GITHUB_OUTPUT
          echo "timestamp=$(date +%s)" >> $GITHUB_OUTPUT

      - name: 发布到 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: ${{ startsWith(github.ref_name, 'dev/') }}
          files: |
            kernel/*
            usbip/usbip-arm64-bundle.tar.gz
            manager/SukiSU-Ultra-Manager.apk
