name: Sync Upstream Branches

on:
  workflow_dispatch:
  # schedule:
  #   - cron: '0 0 * * *'

jobs:
  sync:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - upstream_url: https://github.com/Laulan56/android_kernel_xiaomi_sm8150
            branch: lineage-16.0
          - upstream_url: https://github.com/Laulan56/android_kernel_xiaomi_sm8150
            branch: lineage-17.1
          - upstream_url: https://github.com/Laulan56/android_kernel_xiaomi_sm8150
            branch: android14
          - upstream_url: https://github.com/xiaomi-sm8150-devs/android_kernel_xiaomi_sm8150-legacy
            branch: lineage-20

    steps:
      - name: 配置 Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: 检查上游分支是否存在
        id: check_branch
        run: |
          BRANCH_REF=$(git ls-remote --heads ${{ matrix.upstream_url }} refs/heads/${{ matrix.branch }})
          if [ -z "$BRANCH_REF" ]; then
            echo "::warning::上游仓库 ${{ matrix.upstream_url }} 不存在分支 ${{ matrix.branch }}，跳过同步"
            echo "branch_exists=false" >> $GITHUB_OUTPUT
          else
            echo "branch_exists=true" >> $GITHUB_OUTPUT
          fi

      - name: 创建临时工作目录
        if: steps.check_branch.outputs.branch_exists == 'true'
        run: |
          mkdir workspace
          cd workspace
          git init

      - name: 添加远程仓库
        if: steps.check_branch.outputs.branch_exists == 'true'
        run: |
          cd workspace
          git remote add origin https://x-access-token:${{ secrets.SYNC_PAT }}@github.com/Geeeeeker/android_kernel_xiaomi_sm8150-lineageos.git
          git remote add upstream ${{ matrix.upstream_url }}

      - name: 拉取并强制同步分支
        if: steps.check_branch.outputs.branch_exists == 'true'
        run: |
          cd workspace
          # 完整拉取分支历史，避免浅克隆导致的 push 失败
          git fetch upstream ${{ matrix.branch }}
          git push -f origin refs/remotes/upstream/${{ matrix.branch }}:refs/heads/${{ matrix.branch }}
