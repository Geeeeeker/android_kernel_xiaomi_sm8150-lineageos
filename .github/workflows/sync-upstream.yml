name: Sync Upstream Branches

on:
  workflow_dispatch:          # 手动触发
  # schedule:
  #   - cron: '0 0 * * *'     # 如需每天自动同步取消注释

jobs:
  sync:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # 从 Laulan56 仓库同步的三个分支
          - upstream_url: https://github.com/Laulan56/android_kernel_xiaomi_sm8150
            branch: lineage-16.0
          - upstream_url: https://github.com/Laulan56/android_kernel_xiaomi_sm8150
            branch: lineage-17.1
          - upstream_url: https://github.com/Laulan56/android_kernel_xiaomi_sm8150
            branch: android14
          # 从 xiaomi-sm8150-devs 仓库同步的一个分支
          - upstream_url: https://github.com/xiaomi-sm8150-devs/android_kernel_xiaomi_sm8150-legacy
            branch: lineage-20

    steps:
      - name: 配置 Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: 检查上游分支是否存在（可选但推荐）
        id: check
        run: |
          REF=$(git ls-remote --heads ${{ matrix.upstream_url }} refs/heads/${{ matrix.branch }})
          if [ -z "$REF" ]; then
            echo "::warning::上游无分支 ${{ matrix.branch }}，跳过"
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: 创建临时仓库并拉取推送
        if: steps.check.outputs.skip != 'true'
        run: |
          # 新建空仓库
          mkdir workspace && cd workspace
          git init
          # 添加目标仓库（你的仓库）和上游仓库
          git remote add origin https://x-access-token:${{ secrets.SYNC_PAT }}@github.com/Geeeeeker/android_kernel_xiaomi_sm8150-lineageos.git
          git remote add upstream ${{ matrix.upstream_url }}
          # 完整拉取上游分支（不加 --depth）
          git fetch --no-tags upstream ${{ matrix.branch }}
          # 强制推送到目标仓库同名分支，--no-thin 生成自包含 pack
          git push -f --no-thin origin FETCH_HEAD:refs/heads/${{ matrix.branch }}
